<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAYDOG — Partner Asset Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy: #0a2540;
  --navy-mid: #0d3b6e;
  --blue-accent: #1a7abf;
  --gold: #f4a300;
  --off-white: #f5f7fa;
  --border: #e2e8f0;
  --text: #1a1a2e;
  --muted: #64748b;
  --white: #ffffff;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--text);
  min-height: 100vh;
}

/* LOGIN SCREEN */
#loginScreen {
  position: fixed;
  inset: 0;
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.login-box {
  background: white;
  border-radius: 6px;
  padding: 52px 48px;
  max-width: 420px;
  width: 100%;
  text-align: center;
}

.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  letter-spacing: 5px;
  color: var(--navy);
  margin-bottom: 4px;
}

.login-sub {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 36px;
}

.login-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  display: block;
  margin-bottom: 8px;
}

.login-input {
  width: 100%;
  padding: 13px 16px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  outline: none;
  margin-bottom: 16px;
  color: var(--text);
  transition: border-color 0.2s;
}

.login-input:focus { border-color: var(--blue-accent); }

.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--navy);
  color: white;
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 12px;
}

.login-btn:hover { background: var(--navy-mid); }

.login-error {
  font-size: 13px;
  color: #e53e3e;
  margin-top: 8px;
  display: none;
}

.login-hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 16px;
}

/* MAIN PORTAL */
#portal { display: none; }

/* TOP BAR */
.topbar {
  background: var(--navy);
  padding: 0 48px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 4px;
  color: white;
}

.topbar-logo span { color: var(--gold); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 24px;
}

.topbar-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
}

.logout-btn {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: color 0.2s, border-color 0.2s;
}

.logout-btn:hover { color: white; border-color: rgba(255,255,255,0.4); }

/* HERO STRIP */
.hero-strip {
  background: linear-gradient(90deg, var(--navy-mid), var(--blue-accent));
  padding: 36px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hero-strip h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 2px;
  color: white;
  margin-bottom: 6px;
}

.hero-strip p {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
  font-weight: 300;
}

.dl-selected-btn {
  background: var(--gold);
  color: var(--navy);
  font-size: 11px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: none;
  padding: 13px 28px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.2s, opacity 0.2s;
  white-space: nowrap;
}

.dl-selected-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.dl-selected-btn:not(:disabled):hover { background: #e09500; }

/* CONTROLS BAR */
.controls-bar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 16px 48px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 64px;
  z-index: 40;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 320px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
}

.search-input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  outline: none;
  color: var(--text);
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--blue-accent); }

.filter-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-family: 'DM Sans', sans-serif;
  padding: 8px 16px;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  background: white;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn:hover { border-color: var(--navy); color: var(--navy); }
.filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

.controls-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.select-all-btn {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-family: 'DM Sans', sans-serif;
  background: none;
  border: none;
  color: var(--blue-accent);
  cursor: pointer;
  padding: 8px 0;
}

.count-badge {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

/* PRODUCT SECTIONS */
.portal-body {
  padding: 40px 48px 80px;
  max-width: 1600px;
  margin: 0 auto;
}

.product-section { margin-bottom: 56px; }

.product-section-header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--border);
}

.product-section-header h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--navy);
}

.product-section-header .img-count {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

/* IMAGE CARD */
.img-card {
  background: white;
  border-radius: 5px;
  border: 2px solid transparent;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  position: relative;
}

.img-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
.img-card.selected { border-color: var(--blue-accent); }
.img-card.selected .card-check { opacity: 1; background: var(--blue-accent); }

.card-thumb {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: var(--off-white);
}

.card-thumb-placeholder {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(10,37,64,0.3);
  background: var(--off-white);
}

.card-check {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  border: 2px solid rgba(10,37,64,0.15);
  opacity: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s, background 0.15s;
}

.img-card:hover .card-check { opacity: 1; }

.card-check svg {
  width: 12px;
  height: 12px;
  stroke: white;
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.card-info {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
}

.card-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-type {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

.card-dl-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--off-white);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  flex-shrink: 0;
}

.card-dl-btn:hover { background: var(--navy); border-color: var(--navy); }
.card-dl-btn:hover svg { stroke: white; }

.card-dl-btn svg {
  width: 13px;
  height: 13px;
  stroke: var(--navy);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* SELECTED BAR */
.selected-bar {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: 14px 28px;
  border-radius: 40px;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: 0 8px 32px rgba(10,37,64,0.35);
  transition: opacity 0.2s, transform 0.2s;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
}

.selected-bar.visible { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }

.selected-bar-text {
  font-size: 13px;
  font-weight: 500;
}

.selected-bar-dl {
  background: var(--gold);
  color: var(--navy);
  font-size: 11px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: none;
  padding: 9px 20px;
  border-radius: 20px;
  cursor: pointer;
  transition: background 0.15s;
}

.selected-bar-dl:hover { background: #e09500; }

.selected-bar-clear {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  padding: 9px 0;
  transition: color 0.15s;
}

.selected-bar-clear:hover { color: white; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
  display: none;
}

.empty-state h3 { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">BAY<span style="color:var(--gold)">DOG</span></div>
    <div class="login-sub">Partner Asset Portal</div>
    <label class="login-label">Access Code</label>
    <input type="password" class="login-input" id="loginInput" placeholder="Enter access code" autocomplete="off">
    <button class="login-btn" onclick="checkLogin()">Access Portal</button>
    <div class="login-error" id="loginError">Incorrect access code. Please try again.</div>
    <div class="login-hint">Contact your BAYDOG rep for access.</div>
  </div>
</div>

<!-- PORTAL -->
<div id="portal">
  <div class="topbar">
    <div class="topbar-logo">BAY<span>DOG</span></div>
    <div class="topbar-right">
      <span class="topbar-label">Partner Asset Portal</span>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="hero-strip">
    <div>
      <h1>Brand Assets</h1>
      <p>Product photography for retail partners, sales reps & distributors.</p>
    </div>
    <button class="dl-selected-btn" id="heroDownloadBtn" disabled onclick="downloadSelected()">
      Download Selected (0)
    </button>
  </div>

  <div class="controls-bar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search products or image type…" oninput="filterAssets()">
    </div>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-filter="all" onclick="setFilter(this,'all')">All Products</button>
      <button class="filter-btn" data-filter="harnesses" onclick="setFilter(this,'harnesses')">Harnesses</button>
      <button class="filter-btn" data-filter="leashes" onclick="setFilter(this,'leashes')">Leashes</button>
      <button class="filter-btn" data-filter="lifejackets" onclick="setFilter(this,'lifejackets')">Life Jackets</button>
      <button class="filter-btn" data-filter="toys" onclick="setFilter(this,'toys')">Toys</button>
      <button class="filter-btn" data-filter="accessories" onclick="setFilter(this,'accessories')">Accessories</button>
    </div>
    <div class="controls-right">
      <button class="select-all-btn" onclick="selectAll()">Select All Visible</button>
      <span class="count-badge" id="countBadge">120 assets</span>
    </div>
  </div>

  <div class="portal-body" id="portalBody"></div>
  <div class="empty-state" id="emptyState">
    <h3>No assets found</h3>
    <p>Try adjusting your search or filter.</p>
  </div>
</div>

<!-- SELECTED FLOATING BAR -->
<div class="selected-bar" id="selectedBar">
  <span class="selected-bar-text" id="selectedBarText">0 selected</span>
  <button class="selected-bar-dl" onclick="downloadSelected()">Download All</button>
  <button class="selected-bar-clear" onclick="clearSelection()">Clear</button>
</div>

const TYPE_COLORS = {
  'Hero': '#0a2540',
  'Lifestyle': '#1a7abf',
  'Detail': '#64748b',
  'On-Dog': '#16803c',
  'Action': '#b45309',
  'Flat Lay': '#7c3aed',
  'Color Family': '#be185d',
  'Side': '#475569',
  'Logo': '#f4a300',
  'Brand Guide': '#0d3b6e',
  'Brand': '#1a7abf',
};

let selectedIds = new Set();
let activeFilter = 'all';
let searchQuery = '';

function checkLogin() {
  const val = document.getElementById('loginInput').value.trim();
  if (val === ACCESS_CODE) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('portal').style.display = 'block';
    renderPortal();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginInput').value = '';
    document.getElementById('loginInput').focus();
  }
}

document.getElementById('loginInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkLogin();
});

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('portal').style.display = 'none';
  document.getElementById('loginInput').value = '';
  selectedIds.clear();
  updateSelectionUI();
}

function setFilter(btn, filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPortal();
}

function filterAssets() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderPortal();
}

function getVisible() {
  return PRODUCTS.filter(p => {
    if (activeFilter !== 'all' && p.category !== activeFilter) return false;
    if (searchQuery) {
      const nameMatch = p.name.toLowerCase().includes(searchQuery);
      const imgMatch = p.images.some(i => i.name.toLowerCase().includes(searchQuery) || i.type.toLowerCase().includes(searchQuery));
      if (!nameMatch && !imgMatch) return false;
    }
    return true;
  });
}

function renderPortal() {
  const visible = getVisible();
  const body = document.getElementById('portalBody');
  const empty = document.getElementById('emptyState');
  let totalCount = 0;

  if (visible.length === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('countBadge').textContent = '0 assets';
    return;
  }

  empty.style.display = 'none';
  body.innerHTML = '';

  visible.forEach(product => {
    let imgs = product.images;
    if (searchQuery) {
      imgs = imgs.filter(i => i.name.toLowerCase().includes(searchQuery) || i.type.toLowerCase().includes(searchQuery) || product.name.toLowerCase().includes(searchQuery));
    }
    if (imgs.length === 0) return;
    totalCount += imgs.length;

    const section = document.createElement('div');
    section.className = 'product-section';
    section.dataset.category = product.category;

    section.innerHTML = `
      <div class="product-section-header">
        <h2>${product.name}</h2>
        <span class="img-count">${imgs.length} image${imgs.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="image-grid" id="grid-${product.id}"></div>
    `;
    body.appendChild(section);

    const grid = document.getElementById('grid-' + product.id);
    imgs.forEach(img => {
      const cardId = img.name;
      const card = document.createElement('div');
      card.className = 'img-card' + (selectedIds.has(cardId) ? ' selected' : '');
      card.dataset.id = cardId;
      card.innerHTML = `
        <div class="card-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="card-thumb-placeholder" style="background:${hexToLight(TYPE_COLORS[img.type] || '#0a2540')};">
          <span style="color:${TYPE_COLORS[img.type] || '#0a2540'}; opacity:0.6;">${img.type}</span>
        </div>
        <div class="card-info">
          <div class="card-name" title="${img.name}">${img.name.replace(/_/g,' ')}</div>
          <div class="card-meta">
            <span class="card-type" style="color:${TYPE_COLORS[img.type] || '#64748b'}">${img.type}</span>
            <button class="card-dl-btn" onclick="downloadSingle('${img.name}','${img.url || ''}',event)" title="Download">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
          </div>
        </div>
      `;
      card.addEventListener('click', (e) => {
        if (e.target.closest('.card-dl-btn')) return;
        toggleSelect(cardId, card);
      });
      grid.appendChild(card);
    });
  });

  document.getElementById('countBadge').textContent = totalCount + ' assets';
}

function hexToLight(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.08)`;
}

function toggleSelect(id, card) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
    card.classList.remove('selected');
  } else {
    selectedIds.add(id);
    card.classList.add('selected');
  }
  updateSelectionUI();
}

function selectAll() {
  const visible = getVisible();
  visible.forEach(p => {
    let imgs = p.images;
    if (searchQuery) imgs = imgs.filter(i => i.name.toLowerCase().includes(searchQuery) || i.type.toLowerCase().includes(searchQuery) || p.name.toLowerCase().includes(searchQuery));
    imgs.forEach(img => selectedIds.add(img.name));
  });
  document.querySelectorAll('.img-card').forEach(c => c.classList.add('selected'));
  updateSelectionUI();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
  updateSelectionUI();
}

function updateSelectionUI() {
  const count = selectedIds.size;
  const bar = document.getElementById('selectedBar');
  const heroBtn = document.getElementById('heroDownloadBtn');
  document.getElementById('selectedBarText').textContent = count + ' selected';
  heroBtn.textContent = `Download Selected (${count})`;
  heroBtn.disabled = count === 0;
  if (count > 0) bar.classList.add('visible');
  else bar.classList.remove('visible');
}

function downloadSingle(name, url, e) {
  e.stopPropagation();
  if (url) {
    const a = document.createElement('a');
    a.href = url;
    a.download = name + '.jpg';
    a.click();
  } else {
    alert(`Image URL not yet set for: ${name}\n\nReplace the empty url: '' in the PRODUCTS data with your hosted image URL.`);
  }
}

function downloadSelected() {
  if (selectedIds.size === 0) return;
  const allImgs = PRODUCTS.flatMap(p => p.images);
  let downloaded = 0;
  selectedIds.forEach(id => {
    const img = allImgs.find(i => i.name === id);
    if (img && img.url) {
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = img.url;
        a.download = img.name + '.jpg';
        a.click();
      }, downloaded * 300);
      downloaded++;
    }
  });
  if (downloaded === 0) {
    alert(`${selectedIds.size} images selected, but no URLs have been set yet.\n\nTo activate downloads, replace the empty url: '' values in the PRODUCTS data with your hosted image URLs (Shopify CDN, S3, etc.).`);
  }
}
